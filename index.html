    <!-- Script de Movimento do Gatinho -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const cat = document.getElementById('cat-container');

            // Posiciona o gatinho no centro da tela ao iniciar
            let position = (window.innerWidth / 2) - 40; 
            let direction = 1;
            const speed = 8;
            
            // Aplica a posição inicial antes de capturar qualquer tecla, evitando tilts
            cat.style.left = position + "px";
            cat.style.transform = `scale(${direction * 3}, 3)`;

            document.addEventListener("keydown",(e)=>{

                if(e.key === "ArrowLeft"){
                    position -= speed;
                    direction = -1;
                }

                if(e.key === "ArrowRight"){
                    position += speed;
                    direction = 1;
                }

                if(position < 20) position = 20;
                if(position > window.innerWidth - 120) position = window.innerWidth - 120;

                cat.style.left = position + "px";
                cat.style.transform = `scale(${direction * 3}, 3)`;
            });

        });
    </script>
